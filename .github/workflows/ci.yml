# GitHub Actions（公開 repo 免費；私有 repo 每月 2,000 分鐘免費）
# 流程：build → test → 打包映像 →（選）部署
name: ci
on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build & test
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
      # 推到 GitHub Container Registry（免費），需要 repo 設定 packages: write
      # - name: Push images (Jib)
      #   run: mvn -B -pl bnk-svc-account,bnk-core-emulator jib:build -Djib.to.image=ghcr.io/${{ github.repository_owner }}/\${project.artifactId}
      #   env: { JIB_TO_AUTH_USERNAME: ${{ github.actor }}, JIB_TO_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }} }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bnk-ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: bnk-ui/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
