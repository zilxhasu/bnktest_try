# 前端靜態檔 + 反向代理到 gateway
server {
    listen 8080;            # 非特權埠，容器可用非 root 執行
    server_tokens off;
    root /usr/share/nginx/html;

    # 常見資安 header（弱掃常要求）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location /api/  { proxy_pass ${GATEWAY_URL}; proxy_set_header X-Forwarded-For $remote_addr; }
    location /auth/ { proxy_pass ${GATEWAY_URL}; proxy_set_header X-Forwarded-For $remote_addr; }

    # Angular 路由：找不到檔案就回 index.html
    location / { try_files $uri $uri/ /index.html; }
}
