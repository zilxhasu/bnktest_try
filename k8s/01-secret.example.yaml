# 範例檔：不要把真的密碼 commit 進 Git！建議用指令建立：
#   kubectl -n bnk create secret generic bnk-secret \
#     --from-literal=DB_PASSWORD=xxx --from-literal=RABBIT_PASSWORD=xxx
# 進階：Sealed Secrets / External Secrets Operator（皆免費開源）
apiVersion: v1
kind: Secret
metadata:
  name: bnk-secret
  namespace: bnk
type: Opaque
stringData:
  DB_PASSWORD: change-me
  RABBIT_PASSWORD: change-me
